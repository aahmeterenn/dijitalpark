// Üye Ol - Signup avatar yükleme
function signupUploadAvatar(ev){
  const file = ev.target.files[0];
  if(!file) return;
  if(file.size > 5*1024*1024){
    showSignupError('Fotoğraf 5MB\'dan büyük olamaz');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e)=>{
    state._signupAvatar = e.target.result;
    const av = document.getElementById('signup-avatar');
    av.innerHTML = `<img src="${e.target.result}"><div class="ico-cam">+</div>`;
  };
  reader.readAsDataURL(file);
}

function showSignupError(msg){
  const e = document.getElementById('signup-error');
  if(!e) return;
  e.textContent = msg;
  e.classList.add('show');
  setTimeout(()=>e.classList.remove('show'), 4000);
}

function completeSignup(){
  const name = document.getElementById('su-name').value.trim();
  const surname = document.getElementById('su-surname').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  const age = document.getElementById('su-age').value;
  const bio = document.getElementById('su-bio').value.trim();

  if(!name){ showSignupError('Adınızı girin'); document.getElementById('su-name').focus(); return; }
  if(!surname){ showSignupError('Soyadınızı girin'); document.getElementById('su-surname').focus(); return; }
  if(!email || !email.includes('@') || !email.includes('.')){ showSignupError('Geçerli bir e-posta girin'); document.getElementById('su-email').focus(); return; }
  if(!password || password.length<6){ showSignupError('Şifre en az 6 karakter olmalı'); document.getElementById('su-password').focus(); return; }
  if(!age){ showSignupError('Yaş aralığınızı seçin'); return; }

  // Kayıt başarılı - state'e yaz
  state.sessionType = 'new';
  state.profile = {
    name, surname, age, city:'', email, bio,
    avatar: state._signupAvatar || null,
    isPublic: true,
  };
  // Yaş zaten alındı, sorularda tekrar sormamak için answers'a koy
  state.answers = state.answers || {};
  state.answers.age = age;

  state._signupAvatar = null;
  showToast(`Hoş geldin ${name}! Şimdi sana en uygun rotayı bulalım.`);
  setTimeout(()=>navigate('q-'+QUESTIONS[0].id), 800);
}

function runMatch(){
  state.routePercentages = calculatePercentages(state.answers);

  // Tüm rotaları yakınlık (km) sırasına göre düzenle ve süreyi optimize et
  ROUTES.forEach(r=>{
    if(r.key === 'karisik') return; // karışık ayrıca üretiliyor
    // km'ye göre sırala (yakından uzağa)
    r.locations.sort((a,b) => parseFloat(a.km) - parseFloat(b.km));
    // Toplam mesafe ve optimize süre
    const distances = r.locations.map(l=>parseFloat(l.km));
    const totalKm = distances.reduce((sum,k)=>sum+k, 0);
    r.distance = Math.round(totalKm);
    // Süre: ortalama 30dk/durak + ek mesafe için 1dk/km
    const baseStopTime = r.locations.length * 30;
    const travelTime = Math.round(totalKm * 0.6);
    r.duration = baseStopTime + travelTime;
  });

  buildKarisikRoute();
  const top = Object.entries(state.routePercentages).sort((a,b)=>b[1]-a[1])[0];
  state.matched = top[0];
  renderMatch();
  navigate('match');
}

function renderMatch(){
  const route = ROUTES.find(r=>r.key===state.matched) || ROUTES[0];
  document.getElementById('m-letter').textContent = route.letter;
  document.getElementById('m-code').textContent = route.key.toUpperCase();
  const [first,...rest] = route.name.split(' ');
  document.getElementById('m-name').innerHTML = `<em>${first}</em> ${rest.join(' ')}`;

  if(ms_hours) ms_hours.textContent = `~${Math.round(route.duration/60)}`;

  ms.querySelectorAll('.ring, .route-core, .match-eyebrow, .match-title, .match-result, .start-btn, .match-stats').forEach(el=>{

}

// Kuş bakışı mini harita SVG üreteci
function generateBirdsEyeMap(route, large){
  const locCount = Math.min(route.locations.length, 8); // max 8 nokta göster
  if(locCount < 2) return '';

  // Her lokasyon için pseudo-random ama tutarlı konumlar (rota key'inden seed)
  const seed = route.key.split('').reduce((a,c)=>a+c.charCodeAt(0), 0);
  const rand = (i, offset=0) => {
    const x = Math.sin((seed + i * 7.31 + offset) * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  };

  // Nokta koordinatları (genişlik 100, yükseklik 80'lik SVG viewbox)
  const points = [];
  for(let i=0; i<locCount; i++){
    const baseX = 10 + (i / (locCount-1)) * 80;
    const variance = (rand(i, 1) - 0.5) * 30;
    const x = Math.max(8, Math.min(92, baseX + variance));
    const y = 15 + rand(i, 2) * 50;
    points.push({x, y});
  }

  // Bağlantı çizgileri
  const lineWidth = large ? 1.2 : 0.7;
  const lines = points.slice(1).map((p,i)=>{
    const prev = points[i];
    return `<line x1="${prev.x}" y1="${prev.y}" x2="${p.x}" y2="${p.y}" stroke="rgba(255,216,154,.75)" stroke-width="${lineWidth}" stroke-dasharray="2.5 1.5" stroke-linecap="round"/>`;
  }).join('');

  // Noktalar — büyük versiyonda daha belirgin
  const baseR = large ? 3.2 : 2;
  const dots = points.map((p,i)=>{
    const isStart = i===0;
    const isEnd = i===points.length-1;
    const r = isStart || isEnd ? baseR * 1.3 : baseR;
    const fill = isStart ? '#FFD89A' : (isEnd ? '#5BC494' : '#fff');
    const haloR = (isStart || isEnd) ? r * 1.8 : 0;
    return `
      ${haloR ? `<circle cx="${p.x}" cy="${p.y}" r="${haloR}" fill="${fill}" opacity=".25"/>` : ''}
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fill}" opacity="1" stroke="rgba(0,0,0,.3)" stroke-width=".3"/>
      ${large ? `<text x="${p.x}" y="${p.y + 1.2}" font-size="3" fill="rgba(0,0,0,.6)" text-anchor="middle" font-weight="bold" font-family="Fraunces, serif">${i+1}</text>` : ''}`;
  }).join('');

  return `
    <svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="grid-${route.key}-${large?'l':'s'}" width="10" height="10" patternUnits="userSpaceOnUse">
          <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,${large?'.1':'.06'})" stroke-width=".3"/>
        </pattern>
      </defs>
      <rect width="100" height="80" fill="url(#grid-${route.key}-${large?'l':'s'})"/>
      ${lines}
      ${dots}
    </svg>`;
}

function renderRdContent(tabIdx){
  const r = ROUTES.find(x=>x.key===state.activeRoute);
  const content = document.getElementById('rd-content');
  if(tabIdx===0){
    // Lokasyonları bölgeye göre grupla
    const groups = {};
    r.locations.forEach((loc,i)=>{
      // Bölgeyi address'ten çıkar (örn: "Çamlıhemşin/Rize" → "Çamlıhemşin")
      let region = loc.region;
      if(!region){
        const addr = loc.address || '';
        if(addr.includes('Merkez') || addr.includes('Rize Merkez')) region = 'Rize Merkez';
        else if(addr.includes('Çamlıhemşin')) region = 'Çamlıhemşin';
        else if(addr.includes('İkizdere')) region = 'İkizdere';
        else if(addr.includes('Çayeli')) region = 'Çayeli';
        else if(addr.includes('Pazar')) region = 'Pazar';
        else if(addr.includes('Ardeşen')) region = 'Ardeşen';
        else if(addr.includes('Fındıklı')) region = 'Fındıklı';
        else if(addr.includes('İyidere')) region = 'İyidere';
        else region = 'Diğer';
      }
      if(!groups[region]) groups[region] = [];
      groups[region].push({...loc, _origIdx: i});
    });

    // Bölge ikonları
    const regionIcons = {
      'Rize Merkez':'⌂', 'Çamlıhemşin':'⛰', 'İkizdere':'☘',
      'Çayeli':'☕', 'Pazar':'≈', 'Ardeşen':'✦',
      'Fındıklı':'❀', 'İyidere':'◊', 'Diğer':'◉'
    };

    // Her grup için kartları üret
    let groupsHtml = '';
    Object.entries(groups).forEach(([region, locs])=>{
      groupsHtml += `
        <div class="region-group">
          <div class="region-header">
            <div class="ic">${regionIcons[region]||'◉'}</div>
            <div class="text">
              <div class="name">${region}</div>
              <div class="meta">${locs.length} NOKTA · ${region==='Rize Merkez'?'ŞEHİR':region==='Çamlıhemşin'||region==='İkizdere'?'YAYLA & DAĞ':'KIYI & VADİ'}</div>
            </div>

function buildGoogleMapsRouteUrl(route){
  const origin = route.locations[0];
  const dest = route.locations[route.locations.length-1];
  const waypoints = route.locations.slice(1,-1).map(l=>encodeURIComponent(l.name+', Rize')).join('|');
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin.name+', Rize')}&destination=${encodeURIComponent(dest.name+', Rize')}&waypoints=${waypoints}`;
}

    <div class="cat-grid" id="cat-grid">
      ${QUIZ_CATEGORIES.map(c=>`
        <div class="cat-opt" data-cat="${c.id}" onclick="selectCategory('${c.id}',this)">
          <div class="ico">${c.ico}</div>
          <div class="nm">${c.name}</div>
        </div>`).join('')}
    </div>
    <button class="quiz-close" id="start-quiz-btn" disabled style="opacity:.5;margin-top:16px" onclick="startQuiz()">Yarışmayı Başlat</button>
  `;

function selectCategory(cat, el){
  document.querySelectorAll('.cat-opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  state.quizCategory = cat;
  const btn = document.getElementById('start-quiz-btn');
  btn.disabled = false;
  btn.style.opacity = '1';
}

function startQuiz(){
  state.quizProgress = {current:0,correct:0,wrong:0,answered:[]};
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const cat = state.quizCategory;
  const bank = QUIZ_BANK[cat] || QUIZ_BANK.genel;
  const idx = state.quizProgress.current;
  if(idx>=5) return showQuizResult();

  // Tekrar olmadan rastgele soru seç
  const availableIndexes = bank.map((_,i)=>i).filter(i=>{
    const key = cat + '_' + i;
    return !state.usedQuizQuestions.has(key);
  });

  let q, qIdx;
  if(availableIndexes.length === 0){
    // Bütün sorular bittiyse havuzu sıfırla
    state.usedQuizQuestions = new Set();
    qIdx = Math.floor(Math.random() * bank.length);
    q = bank[qIdx];
  } else {
    qIdx = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
    q = bank[qIdx];
  }
  state.usedQuizQuestions.add(cat + '_' + qIdx);

  // Bu yarışmadaki seçilmiş soruları da tut ki aynı turda tekrar gelmesin
  state.quizProgress.usedInThisRound = state.quizProgress.usedInThisRound || [];
  state.quizProgress.usedInThisRound.push(qIdx);
  state.quizProgress.currentQ = q;

  const sheet = document.getElementById('quiz-sheet');
  const catObj = QUIZ_CATEGORIES.find(c=>c.id===cat);
  const dots = Array.from({length:5},(_,i)=>{
    const ans = state.quizProgress.answered[i];
    if(ans===true) return '<div class="q-dot correct"></div>';
    if(ans===false) return '<div class="q-dot wrong"></div>';
    if(i===idx) return '<div class="q-dot active"></div>';
    return '<div class="q-dot"></div>';
  }).join('');

  sheet.innerHTML = `
    <div class="qbadge">${catObj.ico} ${catObj.name.toUpperCase()} · ${idx+1}/5</div>
    <div class="q-head" style="margin-top:14px">
      <div class="loc">RİZE · SORU ${idx+1}</div>
      <div class="pts">5p</div>
    </div>
    <div class="q-progress-dots">${dots}</div>
    <div class="q-text">${q.q}</div>
    <div class="quiz-options" id="quiz-options">
      ${q.a.map((opt,i)=>`
        <div class="q-opt" data-idx="${i}" onclick="answerQuestion(${i},${q.c})">
          <div class="alph">${['A','B','C','D'][i]}</div>${opt}
        </div>`).join('')}
    </div>
  `;
}

function answerQuestion(chosen, correct){
  const opts = document.querySelectorAll('#quiz-options .q-opt');
  opts.forEach(o=>o.classList.add('disabled'));
  if(chosen===correct){
    opts[chosen].classList.add('correct');
    state.quizProgress.correct++;
    state.quizProgress.answered.push(true);
  } else {
    opts[chosen].classList.add('wrong');
    opts[correct].classList.add('correct');
    state.quizProgress.wrong++;
    state.quizProgress.answered.push(false);
  }
  state.quizProgress.current++;
  setTimeout(()=>{
    if(state.quizProgress.current>=5) showQuizResult();
    else renderQuizQuestion();
  }, 1200);
}

function showQuizResult(){
  const {correct,wrong} = state.quizProgress;
  // Kural: 2 ya da daha fazla yanlış → sadece 2 puan. Aksi halde doğrular × 5
  let earned;
  if(wrong>=2){ earned = 2; }
  else { earned = correct * 5; }

  state.points += earned;
  state.scannedQRs++;
  state.distanceKm = +(state.distanceKm + 1.2).toFixed(1);
  if(state.points >= state.level * 200) state.level++;

  const sheet = document.getElementById('quiz-sheet');
  const msg = correct===5 ? '🎉 <em>Kusursuz!</em>' : correct>=3 ? '<em>Aferin!</em>' : correct>=1 ? 'İyi <em>deneme</em>' : 'Sorun <em>değil</em>';
  sheet.innerHTML = `
    <div class="qbadge" style="background:${earned>10?'var(--copper)':'var(--tea-600)'}">${earned>10?'HARİKA':'TAMAMLANDI'}</div>
    <div class="quiz-final">
      <div class="big">${msg}</div>
      <div class="score-grid">
        <div class="sg"><div class="n">${correct}</div><div class="l">Doğru</div></div>
        <div class="sg"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">Yanlış</div></div>
        <div class="sg"><div class="n" style="color:var(--copper)">${earned}</div><div class="l">Puan</div></div>
      </div>
      <div class="pts-won">+${earned}p kazandın</div>
      ${wrong>=2?'<div style="font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.5">2+ yanlış olduğu için ödül 2 puana düşürüldü. Bir sonraki turda daha dikkatli! 💪</div>':''}
    </div>
    <button class="quiz-close" onclick="closeQuiz()">Tamamla</button>
  `;
}

function closeQuiz(){
  document.getElementById('quiz-backdrop').classList.remove('open');
  document.getElementById('quiz-sheet').classList.remove('open');
  setTimeout(()=>{ if(state.current==='scan') navigate('routes-select'); }, 400);
}

// Profil resim galerisine yükleme
function uploadProfilePhoto(ev){
  const files = Array.from(ev.target.files || []);
  if(files.length===0) return;

  files.forEach(file=>{
    if(file.size > 5*1024*1024){
      showToast(`${file.name} 5MB'dan büyük, atlanıyor`, false);
      return;
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const date = new Date();
      state.uploadedPhotos.unshift({
        src: e.target.result,
        date: date.toLocaleDateString('tr-TR'),
        location: state.activeRoute ? (ROUTES.find(r=>r.key===state.activeRoute)?.name || 'Rize') : 'Rize',
      });
      renderUserPhotos();
    };
    reader.readAsDataURL(file);
  });
  // input sıfırla ki aynı dosya tekrar seçilebilsin
  ev.target.value = '';
  showToast(`${files.length} resim yüklendi`);
}
